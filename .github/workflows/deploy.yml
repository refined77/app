name: Deploy to Cloudflare Pages

# Publishes the Botanical Reverie OPS app to the `botanical-reverie`
# Cloudflare Pages project on every push to main.
# Requires one repo secret: CLOUDFLARE_API_TOKEN with permissions:
#   Account · Cloudflare Pages · Edit   AND   User · User Details · Read
on:
  push:
    branches: [main]
  workflow_dispatch: {}      # lets you trigger a deploy by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.101.0 pages deploy . --project-name=botanical-reverie --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31f5dc4a18b578bd53720ca983f52a61
